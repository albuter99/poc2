name: Publier la PoC MDM sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Attendre la disponibilité de l'artifact
        run: sleep 8
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4